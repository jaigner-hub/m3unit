[package]
name = "m3unit"
version = "0.1.0"
edition = "2024"
description = "A Winamp-flavored desktop player that streams M3U playlists from the internet"

[dependencies]
anyhow = "1"
eframe = "0.36"
egui = "0.36"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "charset", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rodio = { version = "0.22", default-features = false, features = ["playback", "mp3", "flac", "vorbis", "wav", "mp4"] }
stream-download = { version = "0.24", default-features = false, features = ["reqwest", "temp-storage"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pin the IDNA backend to unicode-rs instead of ICU4X: smaller, and two fewer
# build scripts for Windows Smart App Control to object to.
idna_adapter = "~1.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
